name: CD Pipeline (Deploy to AWS EC2)

on:
  #Automatically triggers ONLY after the CI pipeline completes on the main branch
  workflow_run:
    workflows: ["CI Pipeline (Build & Test)"]
    types:
      - completed
    branches:
      - main
  #Also allows manual trigger from Actions tab whenever needed
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Stack to EC2
    runs-on: ubuntu-latest
    #Run only if triggered manually OR if the preceding CI workflow succeeded
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            APP_DIR="snapFind"
            if [ ! -d "$APP_DIR" ]; then
              echo "Cloning repository..."
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
              cd "$APP_DIR"
            else
              echo "Pulling latest code..."
              cd "$APP_DIR"
              git fetch origin main
              git reset --hard origin/main
            fi

            echo "Writing environment variables..."
            cat << 'EOF' > .env
            SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}
            SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}
            SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_S3_BUCKET_NAME=${{ secrets.AWS_S3_BUCKET_NAME }}
            EOF

            echo "Stopping old containers and removing ALL old images..."
            docker compose down --remove-orphans --rmi all || true

            echo "Clearing any corrupted Docker builder cache..."
            docker builder prune -af || true

            echo "Building fresh images from scratch..."
            docker compose build --no-cache
            docker compose up -d

            echo "Verifying backend and database connection..."
            SUCCESS=0
            for i in {1..12}; do
              sleep 5
              if docker logs snapfind-backend 2>&1 | grep -q "Started BackendApplication"; then
                echo "========================================================"
                echo "SUCCESS: Spring Boot connected to RDS Database and is LIVE!"
                echo "========================================================"
                SUCCESS=1
                break
              fi
              echo "Waiting for DB connection and app startup... ($((i*5))s)"
            done

            if [ $SUCCESS -eq 0 ]; then
              echo "WARNING: Backend may still be initializing or encountered an issue. Showing recent logs:"
              docker logs snapfind-backend --tail 40
            fi

            echo "Pruning old containers, dangling images, and build cache for optimization..."
            docker container prune -f
            docker image prune -f
            docker builder prune -f --keep-storage 2GB || true

            echo "Deployment completed successfully!"
