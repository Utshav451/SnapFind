name: CD Pipeline (Deploy to AWS EC2)

on:
  #Automatically triggers ONLY after the CI pipeline completes on the main branch
  workflow_run:
    workflows: ["CI Pipeline (Build & Test)"]
    types:
      - completed
    branches:
      - main
  #Also allows manual trigger from Actions tab whenever needed
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Stack to EC2
    runs-on: ubuntu-latest
    #Run only if triggered manually OR if the preceding CI workflow succeeded
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            APP_DIR="snapFind"
            if [ ! -d "$APP_DIR" ]; then
              echo "Cloning repository..."
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
              cd "$APP_DIR"
            else
              echo "Pulling latest code..."
              cd "$APP_DIR"
              git fetch origin main
              git reset --hard origin/main
            fi

            echo "Writing environment variables..."
            cat << 'EOF' > .env
            SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}
            SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}
            SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_S3_BUCKET_NAME=${{ secrets.AWS_S3_BUCKET_NAME }}
            EOF

            echo "Building and starting Docker containers..."
            docker compose down --remove-orphans || true
            docker compose up -d --build

            echo "Pruning unused Docker images to save disk space..."
            docker image prune -f

            echo "Deployment completed successfully!"
